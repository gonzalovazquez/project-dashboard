<title>Project Dashboard</title>
<style>
/* Layout: a macOS window on a desktop. Source-list sidebar, toolbar, scrolling content of widgets. Overview first, then a per-project deep dive. */
:root{
  --wall:linear-gradient(135deg,#a9c1ff 0%,#cdb9f3 48%,#f7cbd9 100%);
  --win:#ffffff; --side:rgba(238,238,242,.78); --bg:#f4f4f7; --card:#ffffff; --pop:rgba(250,250,252,.88);
  --label:#1d1d1f; --label2:rgba(60,60,67,.66); --label3:rgba(60,60,67,.36);
  --sep:rgba(60,60,67,.16); --grid:rgba(60,60,67,.1); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --seg-sel:#ffffff; --btn:#ffffff; --field:#ffffff; --zebra:rgba(120,120,128,.045); --hover:rgba(0,122,255,.08);
  --blue:#007aff; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --purple:#af52de; --teal:#30b0c7; --gray:#8e8e93; --indigo:#5856d6; --yellow:#c98f00;
  --shadow:0 0 0 .5px rgba(60,60,67,.18),0 1px 2px rgba(0,0,0,.05);
  --winshadow:0 0 0 .5px rgba(0,0,0,.28),0 24px 70px rgba(30,30,60,.34),0 8px 22px rgba(30,30,60,.16);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wall:linear-gradient(135deg,#17224d 0%,#35266a 50%,#14121f 100%);
  --win:#1e1e20; --side:rgba(46,46,50,.74); --bg:#1c1c1e; --card:#2a2a2d; --pop:rgba(52,52,56,.88);
  --label:#f5f5f7; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.32);
  --sep:rgba(84,84,88,.6); --grid:rgba(235,235,245,.09); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --seg-sel:#636366; --btn:#4a4a4d; --field:#1e1e20; --zebra:rgba(255,255,255,.03); --hover:rgba(10,132,255,.16);
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --purple:#bf5af2; --teal:#40c8e0; --gray:#98989d; --indigo:#7d7aff; --yellow:#ffd60a;
  --shadow:0 0 0 .5px rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.3);
  --winshadow:0 0 0 .5px rgba(255,255,255,.18),0 24px 70px rgba(0,0,0,.6),0 8px 22px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:linear-gradient(135deg,#17224d 0%,#35266a 50%,#14121f 100%);
  --win:#1e1e20; --side:rgba(46,46,50,.74); --bg:#1c1c1e; --card:#2a2a2d; --pop:rgba(52,52,56,.88);
  --label:#f5f5f7; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.32);
  --sep:rgba(84,84,88,.6); --grid:rgba(235,235,245,.09); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --seg-sel:#636366; --btn:#4a4a4d; --field:#1e1e20; --zebra:rgba(255,255,255,.03); --hover:rgba(10,132,255,.16);
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --purple:#bf5af2; --teal:#40c8e0; --gray:#98989d; --indigo:#7d7aff; --yellow:#ffd60a;
  --shadow:0 0 0 .5px rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.3);
  --winshadow:0 0 0 .5px rgba(255,255,255,.18),0 24px 70px rgba(0,0,0,.6),0 8px 22px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--wall);background-attachment:fixed;color:var(--label);font:13px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:default}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:1px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.92em}
.desk{height:100%;padding:22px 24px;display:flex;justify-content:center}
.window{width:min(1380px,100%);height:100%;min-height:600px;max-height:960px;border-radius:12px;background:var(--win);box-shadow:var(--winshadow);display:grid;grid-template-columns:228px minmax(0,1fr);overflow:hidden;position:relative}
.lights{position:absolute;left:16px;top:17px;display:flex;gap:8px;z-index:5}
.lights i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}

/* sidebar */
.side{background:var(--side);backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);border-right:.5px solid var(--sep);padding:52px 10px 12px;display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:0}
.sec{display:flex;flex-direction:column;gap:1px}
.sec h6{margin:0 0 3px;padding:0 8px;font:600 11px var(--font);color:var(--label3);display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border:0;background:none;border-radius:6px;text-align:left;width:100%;color:var(--label)}
.item:hover{background:var(--fill)}
.item[aria-current="page"]{background:var(--fill2)}
.item svg.ic{width:16px;height:16px;flex:none;color:var(--blue)}
.item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .c{font-size:11.5px;color:var(--label2)}
.item .c.al{color:var(--orange);font-weight:600}
.item.slot-empty{color:var(--label3);border:1px dashed var(--sep);height:26px}
.sidefoot{margin-top:auto;padding:8px;font-size:11.5px;color:var(--label2);display:flex;flex-direction:column;gap:3px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}

/* main + toolbar */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.toolbar{height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px 0 20px;background:var(--win);border-bottom:.5px solid var(--sep)}
.toolbar .ttl{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.toolbar .ttl b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar .ttl span{font-size:11.5px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar .sp{flex:1}
.content{flex:1;overflow:auto;padding:20px 24px 44px;display:flex;flex-direction:column;gap:16px;min-height:0}
.seg{display:inline-flex;background:var(--fill);border-radius:7px;padding:2px;gap:1px}
.seg button{border:0;background:none;border-radius:5px;padding:2px 11px;font-size:12px;color:var(--label)}
.seg button[aria-pressed="true"],.seg button[aria-current="true"]{background:var(--seg-sel);box-shadow:0 .5px 2px rgba(0,0,0,.2),0 0 0 .5px rgba(0,0,0,.04);font-weight:500}
.btn{border:0;border-radius:6px;background:var(--btn);box-shadow:0 0 0 .5px var(--sep),0 .5px 1.5px rgba(0,0,0,.12);padding:3px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active{filter:brightness(.92)}
.btn.pri{background:var(--blue);color:#fff;box-shadow:0 .5px 1.5px rgba(0,0,0,.2);font-weight:500}
.btn.red{color:var(--red)}
.btn.sm{padding:1px 8px;font-size:12px}
.btn.icon{padding:3px 7px}
.btn svg{width:14px;height:14px}
.btn[disabled]{opacity:.4}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:7px;padding:0 8px;height:24px;width:190px}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;font-size:12.5px}
.search svg{width:13px;height:13px;color:var(--label2)}
.field{width:100%;background:var(--field);border:0;border-radius:6px;box-shadow:0 0 0 .5px var(--sep) inset,0 0 0 .5px var(--sep);padding:5px 8px}
.field:focus{outline:3px solid color-mix(in srgb,var(--blue) 40%,transparent);outline-offset:0}
.field::placeholder{color:var(--orange)}

/* widgets */
.hello{display:flex;flex-direction:column;gap:4px}
.hello .eye{font-size:11.5px;color:var(--label2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.hello h1{margin:0;font:700 24px/1.2 var(--font);letter-spacing:-.02em;text-wrap:balance;max-width:34em}
.hello h1 em{font-style:normal;color:var(--red)}
.hello h1 u{text-decoration:none;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font:600 13px var(--font)}
.card .sub{font-size:11.5px;color:var(--label2);margin-top:-6px}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.kpi{gap:6px;padding:12px 14px}
.kpi .l{font-size:11.5px;color:var(--label2);display:flex;align-items:center;gap:6px}
.kpi .l i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.kpi .v{font:600 28px/1.05 var(--font);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;color:var(--label2);font-weight:500;letter-spacing:0}
.kpi .f{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--label2);min-height:26px}
.chg{font-size:11px;font-weight:600;padding:0 6px;border-radius:99px;white-space:nowrap}
.chg.good{color:var(--green);background:color-mix(in srgb,var(--green) 15%,transparent)}
.chg.bad{color:var(--red);background:color-mix(in srgb,var(--red) 15%,transparent)}
.chg.flat{color:var(--label2);background:var(--fill)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g21{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--label2)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:5px}
svg text{fill:var(--label2);font:10.5px var(--font)}
svg text.b{fill:var(--label);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:0 8px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap;height:18px}
.chip{font-size:11px;color:var(--label2);background:var(--fill);border-radius:4px;padding:0 6px;white-space:nowrap}
.warn{color:var(--orange)} .bad{color:var(--red)} .good{color:var(--green)} .mut{color:var(--label2)}

/* insight list */
.ins{display:flex;flex-direction:column}
.ins div{display:flex;gap:10px;padding:8px 0;border-top:.5px solid var(--sep);align-items:flex-start}
.ins div:first-child{border-top:0;padding-top:0}
.ins i{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);font:700 11px var(--font);font-style:normal;margin-top:1px}
.ins p{margin:0;flex:1;min-width:0}
.ins b{font-weight:600}

/* tables */
.tw{overflow-x:auto;border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:880px}
th{font:600 11.5px var(--font);color:var(--label2);text-align:left;padding:6px 10px;border-bottom:.5px solid var(--sep);white-space:nowrap;position:sticky;top:0;background:var(--card)}
th button{background:none;border:0;padding:0;font:inherit;color:inherit;display:inline-flex;gap:4px;align-items:center}
th button:hover{color:var(--label)}
td{padding:7px 10px;vertical-align:middle;border-bottom:.5px solid var(--sep)}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr[data-action]:hover td{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
.pn{display:flex;flex-direction:column;line-height:1.25}
.pn b{font-weight:600}
.pn span{font-size:11.5px;color:var(--label2)}
.pb{display:flex;align-items:center;gap:8px;min-width:112px}
.pb .tr{flex:1;height:6px;border-radius:3px;background:var(--fill2);overflow:hidden}
.pb .tr i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.hl{display:inline-block;min-width:30px;text-align:center;font-weight:600;border-radius:5px;padding:0 6px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
th.r,td.r{text-align:right}

/* deep dive */
.ph{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.ph .l{flex:1;min-width:260px;display:flex;flex-direction:column;gap:6px}
.ph h1{margin:0;font:700 24px/1.15 var(--font);letter-spacing:-.02em}
.ph .acts{display:flex;gap:6px;flex-wrap:wrap}
.nextbox{display:flex;flex-direction:column;gap:5px;min-width:260px;flex:1}
.nextbox label{font-size:11.5px;color:var(--label2);font-weight:600}
.cl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.cl li{display:flex;gap:9px;align-items:center;padding:7px 0;border-top:.5px solid var(--sep)}
.cl li:first-child{border-top:0}
.cl label{flex:1;min-width:0;display:flex;gap:9px;align-items:center}
.cl input{accent-color:var(--blue);width:15px;height:15px;margin:0}
.cl .d span:first-of-type{color:var(--label2);text-decoration:line-through}
.cl small{font-size:11px;color:var(--label2);white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:104px 1fr 40px;gap:10px;align-items:center;font-size:12px}
.bar .tr{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:3px;background:var(--c,var(--blue))}
.bar .v{text-align:right;color:var(--label2)}
.grp{display:flex;flex-direction:column;border-radius:10px;background:var(--bg);box-shadow:0 0 0 .5px var(--sep)}
.grp div{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;border-top:.5px solid var(--sep)}
.grp div:first-child{border-top:0}
.grp span:first-child{color:var(--label2)}
.grp span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.cm{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.cm li{display:flex;gap:10px;font-size:12px}
.cm time{width:34px;flex:none;color:var(--label2);font:11px var(--mono)}
.lang{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:1px}
.lang i{display:block;background:var(--c)}

/* filters, menus, sheets */
.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pd{position:relative}
.menu{position:absolute;top:calc(100% + 4px);left:0;min-width:190px;background:var(--pop);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-radius:9px;box-shadow:0 0 0 .5px var(--sep),0 10px 30px rgba(0,0,0,.25);padding:5px;z-index:12}
.menu button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:none;border-radius:5px;padding:3px 8px;text-align:left}
.menu button:hover{background:var(--blue);color:#fff}
.menu .ck{width:12px;color:inherit;font-weight:700}
.menu .n{margin-left:auto;color:var(--label2);font-size:11.5px}
.menu button:hover .n{color:#fff}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:20}
.sheet{position:fixed;left:50%;top:max(5%,calc(env(safe-area-inset-top,0px) + 24px));transform:translateX(-50%);width:min(500px,calc(100% - 28px));max-height:90%;overflow:auto;background:var(--pop);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border-radius:12px;box-shadow:0 0 0 .5px var(--sep),0 24px 60px rgba(0,0,0,.4);z-index:22;padding:20px;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font:600 17px var(--font)}
.sheet p{margin:0;color:var(--label2)}
.opt{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--card);box-shadow:0 0 0 .5px var(--sep)}
.opt:has(input:checked){box-shadow:0 0 0 1.5px var(--blue)}
.opt input{accent-color:var(--blue)}
.sf{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11.5px;color:var(--label2);font-weight:600}
.fld select{background:var(--field);border:0;border-radius:6px;box-shadow:0 0 0 .5px var(--sep);padding:4px 6px}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--pop);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:8px;box-shadow:0 0 0 .5px var(--sep),0 8px 24px rgba(0,0,0,.25);padding:6px 9px;font-size:12px;max-width:260px}
.tip b{display:block;font-weight:600}
.tip span{color:var(--label2)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--pop);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--label);padding:8px 16px;border-radius:10px;z-index:50;box-shadow:0 0 0 .5px var(--sep),0 10px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.empty{padding:34px;text-align:center;color:var(--label2)}
.banner{display:flex;gap:10px;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--purple) 12%,transparent);box-shadow:0 0 0 .5px color-mix(in srgb,var(--purple) 35%,transparent)}
.rev .row{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:.5px solid var(--sep);flex-wrap:wrap}
.rev .row:first-child{border-top:0}
.rev .row .g{flex:1;min-width:200px}
.rev .row .why{font-size:12px;color:var(--label2)}
.pick{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--bg);box-shadow:0 0 0 .5px var(--sep)}
.pick:has(input:checked){box-shadow:0 0 0 1.5px var(--blue)}
.pick input{accent-color:var(--blue)}
.pick.dis{opacity:.45}
.sample{font-size:11.5px;color:var(--label2);display:flex;gap:6px;align-items:center}

@media (max-width:1100px){.g21,.g2{grid-template-columns:1fr}}
@media (max-width:820px){
  .desk{padding:0}
  .window{border-radius:0;max-height:none;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .lights{display:none}
  .side{flex-direction:row;overflow-x:auto;padding:10px 12px;gap:8px;border-right:0;border-bottom:.5px solid var(--sep)}
  .sec{flex-direction:row;gap:4px}
  .sec h6,.sidefoot{display:none}
  .item{width:auto;white-space:nowrap}
  .toolbar{height:auto;min-height:48px;padding:8px 14px;flex-wrap:wrap}
  .search{width:140px}
  .content{padding:16px 16px 40px}
  .bar{grid-template-columns:88px 1fr 36px}
}
</style>

<symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.2h7a2 2 0 0 1 2 2v7.3a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>

   ${kpi('Velocity','--teal',`${vel(p).toFixed(2)}<small> / week</small>`,'criteria, last 4 weeks','')}
   ${kpi('Remaining effort','--orange',`${remH(p)}<small> h</small>`,`${remN(p)} criteria open`,'')}
   ${kpi('Commits, 4 weeks','--green',`${c28}`,`vs ${c4b} prior`,chg(pct(c28,c4b)),spark(p.w,70,26,'--green'))}
   ${kpi('Health','--red',`${h}<small>/100</small>`,fl.length?`${fl.length} flag${fl.length>1?'s':''}`:'No flags','',`<span class="hl num" style="--c:var(${hcol(h)})">${h>=60?'Good':h>=40?'Fair':'Poor'}</span>`)}
  </div>
  <div class="g21">
   <section class="card"><div class="hd"><h3>Burnup</h3><span class="mut" style="font-size:11.5px">Criteria completed, with forecast</span></div>${burnup(p)}</section>
   <section class="card"><div class="hd"><h3>Ship criteria</h3><span class="mut num" style="font-size:11.5px">${done}/${total(p)}</span></div>
    <ul class="cl">${p.done.map((d,i)=>`<li><label class="${d.d?'d':''}"><input type="checkbox" data-action="check" data-id="${p.id}" data-i="${i}" ${d.d?'checked':''}><span>${esc(d.t)}</span></label><small class="num">${d.d?'Done '+fmt(d.on):d.h+' h'}</small></li>`).join('')}</ul>
    ${pr===1?`<button class="btn pri" data-action="ship" data-id="${p.id}">Mark shipped</button>`:''}</section>
  </div>
  <div class="g2">
   <section class="card"><div class="hd"><h3>Commit activity</h3><span class="mut" style="font-size:11.5px">Last 12 weeks${p.dirty?' · uncommitted changes':''}</span></div>${heatmap(p)}${weekBars(p)}</section>
   <section class="card"><div class="hd"><h3>Health breakdown</h3><span class="hl num" style="--c:var(${hcol(h)})">${h}</span></div><div class="bars">${healthParts(p).map(([l,v,w])=>`<div class="bar"><span>${l} <span class="mut">${Math.round(w*100)}%</span></span><span class="tr"><i style="width:${v}%;--c:var(${v>=60?'--green':v>=40?'--orange':'--red'})"></i></span><span class="v num">${Math.round(v)}</span></div>`).join('')}</div>
    <h3 style="margin-top:6px">Risks</h3>${fl.length?`<div class="ins">${fl.map(f=>`<div><i style="--c:var(--orange)">!</i><p>${f}</p></div>`).join('')}</div>`:'<div class="mut">Nothing is flagged.</div>'}</section>
  </div>
  <div class="g2">
   <section class="card"><h3>Complexity ${p.cx}/100 · ${cxLvl(p)}</h3><div class="bars">${p.parts.map(x=>`<div class="bar"><span>${x.l}</span><span class="tr"><i style="width:${x.c/x.wt*100}%"></i></span><span class="v num">${x.c.toFixed(0)}/${x.wt}</span></div>`).join('')}</div>
    <h3 style="margin-top:6px">Languages</h3><div class="lang">${lang.map(([n,v,c])=>`<i style="flex:${v};--c:var(${c})" data-tip="${n}|${v}%"></i>`).join('')}</div><div class="legend">${lang.map(([n,v,c])=>`<span style="--c:var(${c})">${n} ${v}%</span>`).join('')}</div></section>
   <section class="card"><h3>Details</h3><div class="grp"><div><span>Notion status</span><span>${p.stage}</span></div><div><span>Time in stage</span><span class="num">${p.stageDays} days</span></div><div><span>Repository</span><span class="mono">${p.gh?'gonzalovazquez/'+esc(p.name):'No remote'}</span></div><div><span>Branch</span><span class="mono">${p.dirty?'main · uncommitted':'main · clean'}</span></div><div><span>Last commit</span><span>${ago(p.last)} ago</span></div><div><span>Folder</span><span class="mono">~/Development/${esc(p.name)}</span></div></div>
    <h3 style="margin-top:6px">Recent commits</h3><ul class="cm">${p.commits.map(([t,m])=>`<li><time>${t}</time><span>${esc(m)}</span></li>`).join('')}</ul></section>
  </div>
  <div class="sample">Sample data. Counts, dates and forecasts are illustrative.</div>`;
}

// ---------- library / inbox
function filtered(){const {stage,pulse,cx,tech}=S.f,q=S.q.trim().toLowerCase();
  return sortRows(P.filter(p=>(!stage.size||stage.has(stageOf(p)))&&(!pulse.size||pulse.has(pulseLvl(p)))&&(!cx.size||cx.has(cxLvl(p)))&&(!tech.size||p.tech.some(t=>tech.has(t)))&&(!q||(p.title+' '+p.name).toLowerCase().includes(q))))}
function pd(key,label,opts,cnt){const n=S.f[key].size;
  return `<div class="pd"><button class="btn" data-action="menu" data-k="${key}" aria-haspopup="true" aria-expanded="${S.menu===key}">${label}${n?` · ${n}`:''}${icon('chev')}</button>${S.menu===key?`<div class="menu" role="menu">${opts.map(o=>`<button role="menuitemcheckbox" aria-checked="${S.f[key].has(o)}" data-action="ftoggle" data-k="${key}" data-v="${esc(o)}"><span class="ck">${S.f[key].has(o)?'✓':''}</span>${esc(o)}<span class="n">${cnt(o)}</span></button>`).join('')}</div>`:''}</div>`}
const resultsHTML=()=>{const r=filtered();return r.length?`<div class="card" style="padding:6px">${portfolioTable(r,true)}</div><div class="sample">${r.length} of ${P.length} projects</div>`:`<div class="card empty">No projects match these filters. Clear a filter to see more.</div>`};
function renderLibrary(){const any=Object.values(S.f).some(s=>s.size);
  return `<div class="fbar">${pd('stage','Stage',['Not started','In progress','Beta','General Available','Parked','Untracked'],o=>P.filter(p=>stageOf(p)===o).length)}${pd('pulse','Activity',['Hot','Warm','Cooling','Dormant'],o=>P.filter(p=>pulseLvl(p)===o).length)}${pd('cx','Complexity',['Low','Medium','High'],o=>P.filter(p=>cxLvl(p)===o).length)}${pd('tech','Technology',TECHS,o=>P.filter(p=>p.tech.includes(o)).length)}${any?`<button class="btn sm" data-action="clearf">Clear filters</button>`:''}</div><div id="results">${resultsHTML()}</div>`}
function renderInbox(){const r=P.filter(p=>!tracked(p));
  return `<div class="mut" style="max-width:62ch">These folders have no Notion page, so they have no stage, ship criteria or next action. Add each to Notion or ignore it. The four TabSaver folders could be grouped into one project.</div>
  <div class="card" style="padding:6px 16px"><div class="ins">${r.map(p=>`<div style="align-items:center"><p><b class="mono" style="font-weight:600">${esc(p.name)}</b><br><span class="mut">${p.tech.join(', ')} · last commit ${ago(p.last)}</span></p>${spark(p.w,52,20,'--gray')}<button class="btn sm" data-action="track" data-id="${p.id}">Add to Notion</button><button class="btn sm" data-action="kill" data-id="${p.id}">Ignore</button></div>`).join('')||'<div class="empty">Inbox is clear.</div>'}</div></div>`}

// ---------- review
function renderReview(){
  const R=S.rev;if(!R.picks)R.picks=focusList().map(p=>p.id);
  const st=P.filter(p=>flags(p).length&&live(p)),steps=['What moved','Decide','Pick focus','Confirm'];let body='';
  if(R.step===0){const fl=focusList(),c1=sum(fl.map(p=>p.w[11])),c0=sum(fl.map(p=>p.w[10]));
    body=`<div class="kpis">${kpi('Commits on focus','--teal',c1,`vs ${c0} last week`,chg(pct(c1,c0)))}${kpi('Criteria checked','--blue',sum(fl.map(p=>hist(p)[11]-hist(p)[10])),'this week','')}${kpi('Shipped','--green','0','in the last 12 weeks','')}${kpi('Flagged','--red',st.length,'projects need a decision','')}</div>
    <section class="card"><h3>Focus projects</h3><div class="rev">${fl.map(p=>`<div class="row"><div class="g"><b>${esc(p.title)}</b><div class="why">${doneN(p)}/${total(p)} criteria · forecast ${fmt(etaD(p))} · ${p.w[11]} commits this week</div></div>${spark(p.w,84,26)}</div>`).join('')}</div></section>`}
  else if(R.step===1){body=`<section class="card"><h3>${st.length} projects need a decision</h3><div class="sub">Choose one outcome for each. Killing a project on purpose counts as finishing it.</div><div class="rev">${st.map(p=>{const d=R.dec[p.id]||'c';return `<div class="row"><div class="g"><b>${esc(p.title)}</b> ${stagePill(p)}<div class="why warn">${flags(p).join(' · ')}</div></div><div class="seg" role="group" aria-label="Decision for ${esc(p.title)}">${[['c','Continue'],['p','Park'],['k','Kill']].map(([k,l])=>`<button aria-pressed="${d===k}" data-action="decide" data-id="${p.id}" data-v="${k}">${l}</button>`).join('')}</div></div>`}).join('')||'<div class="mut">Nothing is stalled.</div>'}</div></section>`}
  else if(R.step===2){const pool=P.filter(p=>live(p)&&!['p','k'].includes(R.dec[p.id])).sort((a,b)=>finishScore(b)-finishScore(a));
    body=`<section class="card"><h3>Choose up to ${WIP} for next week</h3><div class="sub">${R.picks.length} of ${WIP} picked, ranked by closeness to done.</div><div class="stack" style="gap:8px">${pool.map(p=>{const on=R.picks.includes(p.id),dis=!on&&R.picks.length>=WIP;return `<label class="pick ${dis?'dis':''}"><input type="checkbox" id="pick-${p.id}" data-action="pick" data-id="${p.id}" ${on?'checked':''} ${dis?'disabled':''}><span style="flex:1;min-width:0"><b>${esc(p.title)}</b><br><span class="mut">${doneN(p)}/${total(p)} done · ${remH(p)} h left · forecast ${fmt(etaD(p))}</span></span><span class="hl num" style="--c:var(${hcol(health(p))})">${health(p)}</span></label>`}).join('')}</div></section>`}
  else{const picks=R.picks.map(byId);body=`<section class="card"><h3>One next action per focus project</h3>${picks.map(p=>`<div class="fld"><label for="rn-${p.id}">${esc(p.title)}</label><input class="field" id="rn-${p.id}" data-rnext="${p.id}" value="${esc(R.nexts[p.id]??p.next??'')}" placeholder="Next action"></div>`).join('')||'<div class="mut">No projects picked.</div>'}</section>
    <section class="card"><h3>What will change</h3><div class="grp"><div><span>Focus</span><span>${picks.map(p=>esc(p.title)).join(', ')||'none'}</span></div><div><span>Parked</span><span>${st.filter(p=>R.dec[p.id]==='p').map(p=>esc(p.title)).join(', ')||'none'}</span></div><div><span>Killed</span><span>${st.filter(p=>R.dec[p.id]==='k').map(p=>esc(p.title)).join(', ')||'none'}</span></div></div></section>`}
  const last=R.step===3,miss=last&&R.picks.some(id=>!(R.nexts[id]??byId(id).next));
  return `<div><div class="seg" role="group" aria-label="Review steps">${steps.map((s,i)=>`<button aria-current="${i===R.step}" data-action="step" data-v="${i}">${i+1}. ${s}</button>`).join('')}</div></div>${body}
  <div style="display:flex;justify-content:space-between"><button class="btn" data-action="step" data-v="${Math.max(0,R.step-1)}" ${R.step===0?'disabled':''}>Back</button>${last?`<button class="btn pri" data-action="finishreview" ${miss?'disabled':''}>Save to Notion</button>`:`<button class="btn pri" data-action="step" data-v="${R.step+1}">Continue</button>`}</div>${miss?'<div class="mut" style="text-align:right">Add a next action for each focus project to save.</div>':''}`}

// ---------- layers
function quickHTML(p){const pr=prog(p);
  return `<div class="scrim" data-action="close"></div><div class="sheet" role="dialog" aria-label="${esc(p.title)}"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><h2>${esc(p.title)}</h2><div class="mono mut">~/Development/${esc(p.name)}</div></div><button class="btn sm" data-action="close">Done</button></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">${stagePill(p)}${pulsePill(p)}${p.tech.map(t=>`<span class="chip">${t}</span>`).join('')}</div>
  ${tracked(p)?`<div class="kpis" style="grid-template-columns:repeat(3,1fr)">${kpi('Progress','--blue',Math.round((pr||0)*100)+'%',`${doneN(p)}/${total(p)}`,'')}${kpi('Forecast','--indigo',live(p)?fmt(etaD(p)):'–',live(p)?remH(p)+' h left':'','')}${kpi('Health','--orange',health(p),flags(p).length+' flags','')}</div>
  ${flags(p).length?`<div class="warn">${flags(p).join(' · ')}</div>`:''}`:`<p>This folder has no Notion page yet. Add it to give it a stage, ship criteria and a next action.</p>`}
  <div style="display:flex;justify-content:space-between;align-items:center"><span class="mut">Complexity ${p.cx}/100 · last commit ${ago(p.last)}</span>${spark(p.w,110,28,PC[pulseLvl(p)])}</div>
  <div class="sf">${!tracked(p)?`<button class="btn pri" data-action="track" data-id="${p.id}">Add to Notion</button>`:p.life==='parked'?`<button class="btn" data-action="unpark" data-id="${p.id}">Unpark</button>`:live(p)?`${p.focus?`<button class="btn pri" data-action="nav" data-v="project" data-id="${p.id}">Open deep dive</button>`:`<button class="btn pri" data-action="promote" data-id="${p.id}">Move to focus</button>`}<button class="btn" data-action="park" data-id="${p.id}">Park…</button><button class="btn red" data-action="kill" data-id="${p.id}">Kill</button>`:''}</div></div>`}
function swapHTML(inId){const fl=focusList(),inP=inId?byId(inId):null,ch=S.ui.parkTarget?[byId(S.ui.parkTarget)]:fl;
  return `<div class="scrim" data-action="close"></div><div class="sheet" role="dialog" aria-label="Park a project"><h2>${inP?`Focus is full (${fl.length} of ${WIP})`:'Park this project'}</h2>
  <p>${inP?`To move <b>${esc(inP.title)}</b> into focus, park one of these. Parked projects return for review on the date you choose.`:'It leaves your focus and returns for review on the date you choose.'}</p>
  ${ch.length>1?ch.map((p,i)=>`<label class="opt"><input type="radio" name="swap" value="${p.id}" ${i===0?'checked':''}><span><b>${esc(p.title)}</b><br><span class="mut">${doneN(p)}/${total(p)} criteria · forecast ${fmt(etaD(p))} · last commit ${ago(p.last)}</span></span></label>`).join(''):`<input type="hidden" name="swap" id="swapone" value="${ch[0].id}"><div class="opt"><b>${esc(ch[0].title)}</b></div>`}
  <div class="fld"><label for="reason">Reason</label><input class="field" id="reason" placeholder="For example: blocked on API access"></div>
  <div class="fld"><label for="revisit">Revisit in</label><select id="revisit"><option>2 weeks</option><option>1 month</option><option>3 months</option></select></div>
  <div class="sf"><button class="btn" data-action="close">Cancel</button><button class="btn pri" data-action="confirmpark">${inP?'Park and swap':'Park'}</button></div></div>`}

function render(){
  if(S.view==='project'&&!(byId(S.pid)&&byId(S.pid).focus&&byId(S.pid).life==='active'))S.view='overview';
  renderSide();renderToolbar();
  const c=document.getElementById('content'),v=S.view,top=c.scrollTop;
  c.innerHTML=v==='overview'?renderOverview():v==='project'?renderProject():v==='library'?renderLibrary():v==='inbox'?renderInbox():renderReview();
  c.scrollTop=top;renderLayer();
}
function renderLayer(){const el=document.getElementById('layer'),L=S.layer;el.innerHTML=!L?'':L.t==='quick'?quickHTML(byId(L.id)):swapHTML(L.id)}
function promote(id){if(focusList().length>=WIP){S.ui.parkTarget=null;S.layer={t:'swap',id};renderLayer();return}byId(id).focus=true;S.layer=null;toast(byId(id).title+' is now in focus');render()}
function finalizePark(id,reason,rev){const p=byId(id);p.life='parked';p.focus=false;p.park={reason,rev}}
const A={
 nav:e=>{S.view=e.dataset.v;S.pid=e.dataset.id||null;S.layer=null;S.menu=null;if(S.view==='review')S.rev={step:0,dec:{},picks:null,nexts:{}};render();document.getElementById('content').scrollTop=0},
 preset:e=>{S.view='library';S.ui.preset=e.dataset.v||null;Object.values(S.f).forEach(s=>s.clear());if(e.dataset.v)S.f.stage.add(e.dataset.v);S.q='';S.layer=null;render()},
 row:e=>{const p=byId(e.dataset.id);if(p.focus&&p.life==='active'){S.view='project';S.pid=p.id;render();document.getElementById('content').scrollTop=0}else{S.layer={t:'quick',id:p.id};renderLayer()}},
 close:()=>{S.layer=null;renderLayer()},
 mock:e=>toast(e.dataset.m+' (mockup)'),
 theme:()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'},
 rescan:()=>toast('Scanned '+P.length+' folders in 0.4 s (mockup)'),
 range:e=>{S.range=+e.dataset.v;render()},
 sort:e=>{const k=e.dataset.k;S.sort=S.sort.k===k?{k,dir:-S.sort.dir}:{k,dir:k==='name'||k==='stage'?1:-1};render()},
 menu:e=>{S.menu=S.menu===e.dataset.k?null:e.dataset.k;render()},
 ftoggle:e=>{const s=S.f[e.dataset.k],v=e.dataset.v;s.has(v)?s.delete(v):s.add(v);S.ui.preset=null;render()},
 clearf:()=>{Object.values(S.f).forEach(s=>s.clear());S.ui.preset=null;render()},
 check:e=>{const p=byId(e.dataset.id),d=p.done[+e.dataset.i];d.d=e.checked;if(d.d){d.on=TODAY;d.wk=11}render()},
 ship:e=>{const p=byId(e.dataset.id);p.stage='General Available';p.focus=false;p.stageDays=0;toast(p.title+' shipped. A focus slot is free.');S.view='overview';render()},
 promote:e=>promote(e.dataset.id),
 park:e=>{S.ui.parkTarget=e.dataset.id;S.layer={t:'swap',id:null};renderLayer()},
 confirmpark:()=>{const r=document.querySelector('input[name=swap]:checked')||document.getElementById('swapone'),reason=document.getElementById('reason').value||'No reason given',rev=document.getElementById('revisit').value;finalizePark(r.value,reason,rev);const inId=S.layer.id;if(inId)byId(inId).focus=true;S.layer=null;toast(inId?'Parked. The new project is in focus.':'Parked for '+rev);render()},
 unpark:e=>{const p=byId(e.dataset.id);p.life='active';p.park=null;S.layer=null;toast(p.title+' is active again');render()},
 kill:e=>{const p=byId(e.dataset.id);p.life='killed';p.focus=false;S.layer=null;toast(p.title+' closed out');render()},
 track:e=>{const p=byId(e.dataset.id);p.notion=true;p.stage='Not started';p.stageDays=0;p.hist=Array(12).fill(0);S.layer=null;toast('Created a Notion page for '+p.name+' (mockup)');render()},
 step:e=>{S.rev.step=+e.dataset.v;render();document.getElementById('content').scrollTop=0},
 decide:e=>{S.rev.dec[e.dataset.id]=e.dataset.v;render()},
 pick:e=>{const R=S.rev,id=e.dataset.id;R.picks=e.checked?[...R.picks,id]:R.picks.filter(x=>x!==id);render()},
 finishreview:()=>{const R=S.rev;P.forEach(p=>{if(R.dec[p.id]==='p')finalizePark(p.id,'Parked in weekly review','1 month');if(R.dec[p.id]==='k'){p.life='killed';p.focus=false}});P.forEach(p=>{if(live(p))p.focus=R.picks.includes(p.id)});R.picks.forEach(id=>{const n=R.nexts[id];if(n!==undefined)byId(id).next=n||null});S.view='overview';toast('Review saved to Notion (mockup)');render()}
};
document.addEventListener('click',ev=>{
  if(S.menu&&!ev.target.closest('.pd')){S.menu=null;render()}
  const el=ev.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action;if(a==='nav'&&el.tagName==='A')ev.preventDefault();
  if(a==='check'||a==='pick'){if(ev.target!==el)return;A[a](el);return}
  if(el.closest('tr')&&a!=='row')ev.stopPropagation();
  A[a]&&A[a](el)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(S.layer)A.close();else if(S.menu){S.menu=null;render()}}if(ev.key==='Enter'&&ev.target.matches('tr[data-action]'))A.row(ev.target)});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.dataset.next){byId(t.dataset.next).next=t.value.trim()||null;render()}
  else if(t.dataset.rnext){S.rev.nexts[t.dataset.rnext]=t.value.trim();render()}});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){S.q=ev.target.value;document.getElementById('results').innerHTML=resultsHTML()}});
const tip=document.getElementById('tip');
document.addEventListener('mousemove',ev=>{const t=ev.target.closest&&ev.target.closest('[data-tip]');if(!t){tip.hidden=true;return}
  const [a,b]=t.dataset.tip.split('|');tip.innerHTML=`<b>${a}</b><span>${b||''}</span>`;tip.hidden=false;const w=tip.offsetWidth;tip.style.left=Math.min(ev.clientX+14,innerWidth-w-8)+'px';tip.style.top=(ev.clientY+16)+'px'});
render();
</script>
